<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Список покупок</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --s: 0.62;
      --text: #3a2a1c;
      --row: #efe4cf;
      --row-border: #c9b089;
      --brown: #8a5a2b;
      --brown-dark: #3b2310;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Rubik", Arial, sans-serif;
      color: var(--text);
      background: #2b2418;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 16px;
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      background: url("bg.jpg") center / cover no-repeat;
    }
    .bg-shade {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, 0.45) 100%);
    }

    .window {
      position: relative;
      width: 100%;
      max-width: calc(1239px * var(--s));
      border-style: solid;
      border-width: calc(150px * var(--s)) calc(58px * var(--s)) calc(45px * var(--s)) calc(62px * var(--s));
      border-image: url("frame.png") 150 58 45 62 stretch;
      background: radial-gradient(ellipse at center, #e6d2ae 0%, #dac39b 60%, #cdb28a 100%) padding-box;
      padding: calc(35px * var(--s)) calc(8px * var(--s)) calc(8px * var(--s));
      filter: drop-shadow(0 12px 25px rgba(0, 0, 0, 0.5));
    }

    .window::after {
      content: "";
      position: absolute;
      z-index: 1;
      pointer-events: none;
      top: calc(-97px * var(--s));
      left: calc(-54px * var(--s));
      right: calc(-51px * var(--s));
      bottom: calc(-38px * var(--s));
      border-radius: calc(30px * var(--s));
      background:
        radial-gradient(ellipse 70% 60% at 0% 0%, rgba(255, 236, 180, 0.8), rgba(255, 236, 180, 0) 70%),
        linear-gradient(rgba(0, 0, 0, 0) 55%, rgba(60, 30, 5, 0.55) 100%);
      mix-blend-mode: soft-light;
    }
    .window::before {
      content: "";
      position: absolute;
      z-index: 1;
      pointer-events: none;
      top: calc(-97px * var(--s));
      left: calc(-54px * var(--s));
      width: 55%;
      height: 60%;
      border-top-left-radius: calc(30px * var(--s));
      background: radial-gradient(ellipse at 0% 0%, rgba(255, 245, 210, 0.38), rgba(255, 245, 210, 0) 65%);
    }

    .title {
      position: absolute;
      z-index: 2;
      top: calc(-150px * var(--s));
      left: 50%;
      transform: translateX(-50%);
      width: calc(687px * var(--s));
      height: calc(124px * var(--s));
      background: url("title.png") center / contain no-repeat;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    li {
      display: flex;
      align-items: center;
      gap: 14px;
      height: calc(88px * var(--s));
      padding: 0 calc(22px * var(--s));
      margin-bottom: calc(10px * var(--s));
      background: linear-gradient(var(--row), #f3ead9 50%, var(--row));
      border: 2px solid var(--row-border);
      border-radius: 6px;
      box-shadow: inset 0 0 0 2px #f8f1e2;
      font-size: calc(40px * var(--s));
      font-weight: 500;
    }
    li.zero .name,
    li.zero .price,
    li.zero .qty {
      opacity: 0.45;
    }
    .icon {
      width: calc(80px * var(--s));
      height: calc(64px * var(--s));
      flex-shrink: 0;
      background: center / contain no-repeat;
      image-rendering: pixelated;
    }
    .icon.bread  { background-image: url("bread.png"); }
    .icon.ham    { background-image: url("ham.png"); }
    .icon.apple  { background-image: url("apple.png"); }
    .icon.cheese { background-image: url("cheese.png"); }

    .name {
      flex: 1;
      margin-left: calc(20px * var(--s));
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .price {
      white-space: nowrap;
      text-align: right;
      min-width: 2.6em;
      margin-right: calc(16px * var(--s));
    }
    .qty {
      min-width: 3.4em;
      text-align: right;
      white-space: nowrap;
      margin-right: calc(10px * var(--s));
    }

    .btn {
      width: calc(66px * var(--s));
      height: calc(66px * var(--s));
      flex-shrink: 0;
      padding: 0;
      border: 3px solid var(--brown-dark);
      border-radius: 9px;
      background: linear-gradient(#a8743e, var(--brown) 55%, #6e4520);
      box-shadow: inset 0 2px 0 #c99460, inset 0 -3px 0 #5a3718;
      color: #f6e8cc;
      font-family: inherit;
      font-size: calc(44px * var(--s));
      font-weight: 700;
      line-height: 1;
      text-shadow: 0 2px 0 var(--brown-dark), 0 -1px 0 var(--brown-dark), 2px 0 0 var(--brown-dark), -2px 0 0 var(--brown-dark);
      cursor: pointer;
    }
    .btn:hover {
      filter: brightness(1.12);
    }
    .btn:active {
      transform: translateY(2px);
    }
    li .btn + .btn {
      margin-left: calc(-4px * var(--s));
    }

    .bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: calc(40px * var(--s));
      padding-left: calc(22px * var(--s));
    }
    .total {
      display: inline-flex;
      align-items: center;
      gap: calc(14px * var(--s));
      padding: calc(22px * var(--s)) calc(40px * var(--s));
      border: 3px solid #c3a265;
      border-radius: 8px;
      background: var(--row);
      box-shadow: inset 0 0 0 3px var(--row), inset 0 0 0 5px #c3a265;
      font-size: calc(46px * var(--s));
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .coin {
      display: inline-block;
      width: calc(50px * var(--s));
      height: calc(50px * var(--s));
      background: url("coin.png") center / contain no-repeat;
    }

    .buy {
      width: calc(318px * var(--s));
      height: calc(134px * var(--s));
      flex-shrink: 0;
      border: none;
      padding: 0;
      background: url("buy.png") center / contain no-repeat;
      cursor: pointer;
      transition: transform 0.1s, filter 0.1s;
    }
    .buy:hover {
      filter: brightness(1.1) drop-shadow(0 0 8px rgba(255, 210, 90, 0.7));
    }
    .buy:active {
      transform: scale(0.96);
    }

    .message {
      position: absolute;
      z-index: 3;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      padding: 18px 28px;
      border: 3px solid var(--brown-dark);
      border-radius: 10px;
      background: linear-gradient(#a8743e, var(--brown) 55%, #6e4520);
      box-shadow: inset 0 2px 0 #c99460, 0 10px 25px rgba(0, 0, 0, 0.5);
      color: #fbefd4;
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      text-shadow: 0 2px 0 var(--brown-dark);
      white-space: nowrap;
      animation: pop 0.25s ease;
    }
    @keyframes pop {
      from {
        transform: translate(-50%, -50%) scale(0.7);
        opacity: 0;
      }
    }

    @media (max-width: 760px) {
      :root {
        --s: 0.42;
      }
      li {
        gap: 8px;
      }
    }
    @media (max-width: 480px) {
      :root {
        --s: 0.36;
      }
      body {
        padding: 50px 8px 20px;
      }
      li {
        font-size: 15px;
        gap: 5px;
        padding: 0 6px;
      }
      .btn {
        width: 30px;
        height: 30px;
        font-size: 18px;
      }
      .qty {
        min-width: 2.8em;
        margin-right: 4px;
      }
      .total {
        font-size: 12px;
        letter-spacing: 0;
        padding: 8px 8px;
        gap: 4px;
      }
      .bottom {
        gap: 6px;
        padding-left: 0;
      }
      .buy {
        width: 96px;
        height: 42px;
      }
      .coin {
        width: 18px;
        height: 18px;
      }
      .message {
        font-size: 16px;
        white-space: normal;
        width: 80%;
      }
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="bg-shade"></div>

  <div id="root"></div>

  <script type="text/babel">
    // Компонент одного товара. Получает данные через props.
    function ShoppingItem(props) {
      return (
        <li className={props.qty === 0 ? "zero" : ""}>
          <span className={"icon " + props.icon}></span>
          <span className="name">{props.name}</span>
          <span className="price">{props.price} G</span>
          <button className="btn" title="Добавить в корзину" onClick={() => props.onPlus(props.id)}>
            +
          </button>
          <button className="btn" title="Убрать из корзины" onClick={() => props.onMinus(props.id)}>
            −
          </button>
          <span className="qty">{props.qty} шт.</span>
        </li>
      );
    }

    const startItems = [
      { id: 1, name: "Хлеб", icon: "bread", price: 5, qty: 2 },
      { id: 2, name: "Окорок", icon: "ham", price: 15, qty: 1 },
      { id: 3, name: "Яблоки", icon: "apple", price: 3, qty: 5 },
      { id: 4, name: "Сыр", icon: "cheese", price: 8, qty: 1 },
    ];

    // Загружаем сохранённый список из localStorage
    function loadItems() {
      try {
        const saved = localStorage.getItem("rpg-shop-2");
        if (saved) {
          return JSON.parse(saved);
        }
      } catch (error) {}
      return startItems;
    }

    function App() {
      const [items, setItems] = React.useState(loadItems);
      const [message, setMessage] = React.useState("");

      // Каждый раз, когда список меняется, сохраняем его в localStorage
      React.useEffect(() => {
        try {
          localStorage.setItem("rpg-shop-2", JSON.stringify(items));
        } catch (error) {}
      }, [items]);

      function plus(id) {
        setItems(items.map((item) => (item.id === id ? { ...item, qty: item.qty + 1 } : item)));
      }

      function minus(id) {
        setItems(
          items.map((item) => (item.id === id ? { ...item, qty: Math.max(item.qty - 1, 0) } : item))
        );
      }

      // Общая стоимость: цена × количество
      const total = items.reduce((sum, item) => sum + item.price * item.qty, 0);

      function buy() {
        if (total === 0) {
          setMessage("Корзина пуста!");
        } else {
          setMessage("Покупка совершена! Потрачено " + total + " G");
          setItems(items.map((item) => ({ ...item, qty: 0 })));
        }
        setTimeout(() => setMessage(""), 2500);
      }

      return (
        <div className="window">
          <div className="title" role="img" aria-label="Список покупок"></div>

          <ul>
            {items.map((item) => (
              <ShoppingItem
                key={item.id}
                id={item.id}
                name={item.name}
                icon={item.icon}
                price={item.price}
                qty={item.qty}
                onPlus={plus}
                onMinus={minus}
              />
            ))}
          </ul>

          <div className="bottom">
            <div className="total">
              Общая стоимость: {total}
              <span className="coin"></span>
            </div>
            <button className="buy" title="Сделать покупки" aria-label="Сделать покупки" onClick={buy}></button>
          </div>

          {message !== "" && <div className="message">{message}</div>}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>

</body>
</html>
